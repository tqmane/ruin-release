name: Cleanup build runs

on:
  workflow_run:
    workflows: ["Release RUIN"]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete completed build and cleanup runs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          exec >/dev/null 2>&1
          set +e
          if [ -n "$TARGET_RUN_ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}"
          fi
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" --jq '.workflow_runs[] | select(.name=="Cleanup build runs") | .id'); do
            if [ "$id" != "${GITHUB_RUN_ID}" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}"
            fi
          done
          exit 0
